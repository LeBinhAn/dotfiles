git:
  paging:
    colorArg: always
    pager: delta --side-by-side --paging=never
    # Option 1: Catppuccin Frappe (matches current kitty theme)
    # pager: delta --side-by-side --paging=never --features=catppuccin-frappe
    # Option 2: Tokyo Night
    # pager: delta --side-by-side --paging=never --features=tokyo-night
    # Option 3: Dracula
    # pager: delta --side-by-side --paging=never --features=dracula
  branchLogCmd: 'git log --graph --color=always --pretty="%Cred%h%Creset -%C(auto)%d%Creset %s %Cgreen(%ar) %C(bold blue)<%an>%Creset" --decorate=full {{branchName}} --'
  allBranchesLogCmds:
    - git log --graph --color=always --pretty="%Cred%h%Creset -%C(auto)%d%Creset %s %Cgreen(%ar) %C(bold blue)<%an>%Creset" --all --decorate=full
