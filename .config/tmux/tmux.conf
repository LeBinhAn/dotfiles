# Global settings
set -g mouse on
setw -g mode-keys vi
#
# Options to make tmux more pleasant
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Global key-binds
unbind r
bind r source-file ~/.config/tmux/tmux.conf

set-option -g allow-rename off
set-option -g automatic-rename off

set -g renumber-windows on
set-option -g status-position bottom


# Navigation key bind
bind-key h select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -L

# Load tmux-power theme, power-like them. very cool!
# set -g @plugin 'wfxr/tmux-power'
# set -g @tmux_power_theme 'coral'
# -------------------------------

# Theme config
# -------------------------------
# Nord theme
# set -g @plugin "arcticicestudio/nord-tmux"
# set -g @nord_tmux_no_patched_font "0"

# Rose-pine theme
# set -g @plugin 'rose-pine/tmux'
# set -g @rose_pine_variant 'dawn'
# -------------------------------

# Catppuccin Theme (loaded manually; TPM would clash with rose-pine/tmux in plugins/tmux)
set -g @catppuccin_flavor "latte"   # latte, frappe, macchiato, mocha
set -g @catppuccin_reset "true"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"

# Focused pane visibility configuration for Catppuccin Latte (light mode)
# Subdued inactive border; vivid bold blue active border (peach in copy-mode, mauve if synced)
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_1}"
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_peach},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_blue},bold}}"

# Clear any cached module colors on reload so switching themes or reloading doesn't leave stale fg/bg colors
run 'for opt in $(tmux show-options -g 2>/dev/null | awk -F"[ =]" "/^@catppuccin_(status_|.*_color)/ {print \$1}"); do tmux set -ug "$opt"; done'
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Pane border styling and focused pane visibility (full borders, no scrollbar artifact)
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#{@thm_crust} bg=#{@thm_blue} bold] #P #[fg=#{@thm_fg} bg=#{@thm_surface_1} nobold] #{pane_current_command} #[fg=#{@thm_subtext_0}]#{b:pane_current_path} #[default],#[fg=#{@thm_subtext_0} bg=#{@thm_surface_0}] #P #[fg=#{@thm_subtext_0} bg=#{@thm_surface_1}] #{pane_current_command} #[fg=#{@thm_subtext_0}]#{b:pane_current_path} #[default]} "
set -gF display-panes-active-colour "#{@thm_blue}"
set -gF display-panes-colour "#{@thm_overlay_1}"
set -g display-panes-time 2000

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
# -------------------------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# cpu/battery must load after catppuccin so their #{...} placeholders get interpolated
run ~/.config/tmux/plugins/tmux-cpu/cpu.tmux
run ~/.config/tmux/plugins/tmux-battery/battery.tmux
